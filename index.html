<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Student Task Management System</h1>
            <p class="description">
                Manage your assignments, exams, deadlines and study tasks in one place.
            </p>
        </header>

        <section class="task-card">
            <h2>Add New Task</h2>

            <div class="task-form">
                <input type="text" id="taskInput" placeholder="Enter a new task">
                <button onclick="addTask()">Add Task</button>
            </div>

            <p class="hint">Example: Finish programming assignment before Friday</p>
        </section>

        <section class="summary">
            <div>
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div>
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>

            <div>
                <h3 id="remainingTasks">0</h3>
                <p>Remaining</p>
            </div>
        </section>

        <section class="task-list-section">
            <h2>Task List</h2>
            <ul id="taskList"></ul>
            <p id="emptyMessage">No tasks yet. Add your first task above.</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
