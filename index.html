<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Task Management System</h1>
        <p class="description">
            This system helps university students manage assignments, exams, deadlines and study tasks.
        </p>

        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Enter a new task">
            <button onclick="addTask()">Add Task</button>
        </div>

        <h2>Task List</h2>
        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
